<style>
/* Layout idea: one character per screen on practice-paper grid (vermilion lines), blue-black ink, big Next button for the thumb. */
:root{
  --bg:#f1f4f3; --panel:#ffffff; --ink:#17222c; --muted:#56666f; --line:#d3dcd9;
  --grid:#e6aaa4; --ghost:#dfe5e3; --accent:#c4382f; --accent-ink:#ffffff; --ok:#2b7a58;
  --serif:"Noto Serif TC","Songti TC","PMingLiU","Noto Serif CJK TC",serif;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101518; --panel:#192025; --ink:#eef2f1; --muted:#9bacb5; --line:#2b373e;
    --grid:#63403d; --ghost:#2d3940; --accent:#ee6c61; --accent-ink:#1b0e0d; --ok:#5bbd91;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101518; --panel:#192025; --ink:#eef2f1; --muted:#9bacb5; --line:#2b373e;
  --grid:#63403d; --ghost:#2d3940; --accent:#ee6c61; --accent-ink:#1b0e0d; --ok:#5bbd91;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--sans);-webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{cursor:default}
#app{height:100%;display:flex;flex-direction:column;gap:8px;max-width:560px;margin:0 auto;padding:max(8px,env(safe-area-inset-top)) 16px max(10px,env(safe-area-inset-bottom))}

header{display:flex;align-items:center;gap:10px;min-height:44px;flex:none}
.btn-list{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--line);background:var(--panel);border-radius:10px;font-weight:600;font-size:14px}
.btn-list svg{width:18px;height:18px}
#grp{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
#cnt{font-weight:700;font-variant-numeric:tabular-nums;min-width:68px;text-align:right}
#prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;flex:none}
#prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

.board-wrap{flex:1;min-height:0;display:grid;place-items:center;touch-action:pan-y;-webkit-user-select:none;user-select:none}
#board{width:100%;max-height:100%;aspect-ratio:1/1;display:block;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
@supports (width:1cqw){
  .board-wrap{container-type:size}
  #board{width:min(100cqw,100cqh);height:min(100cqw,100cqh);max-height:none}
}
.grid{stroke:var(--grid)}
.ink{fill:var(--ink)}
.ghost{fill:var(--ghost)}
.med{fill:none;stroke:var(--ink);stroke-width:230;stroke-linecap:round;stroke-linejoin:round}
.med.cur{stroke:var(--accent)}
.num circle{fill:var(--accent)}
.num text{fill:var(--accent-ink);font:700 44px var(--sans);text-anchor:middle}
.big{fill:var(--ink);text-anchor:middle;dominant-baseline:central}

.controls{display:flex;align-items:center;gap:8px;flex:none}
.seg{display:flex;flex:1;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:3px;gap:3px}
.seg button{flex:1;height:38px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tog{height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-weight:600;font-size:15px;color:var(--muted)}
.tog[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.off{opacity:.4;pointer-events:none}

#anim{display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex:none}
.speed{display:flex;width:100%;gap:4px;align-items:center}
.speed span{font-size:13px;white-space:nowrap;font-weight:600;color:var(--muted);margin-right:2px}
.speed button{flex:1;white-space:nowrap;padding:0 2px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:13.5px;font-weight:600;color:var(--muted)}
.speed button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#anim[hidden]{display:none}
.ic{width:44px;height:44px;flex:none;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:20px;font-weight:700;line-height:1;display:grid;place-items:center}
#scrub{flex:1;min-width:0;height:44px;accent-color:var(--accent);margin:0}
#stk{min-width:62px;text-align:right;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}

#info{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.r1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.py{font-size:26px;font-weight:700;line-height:1.1}
.lab{font-size:16px;font-weight:600;line-height:1.3}
.pill{margin-left:auto;font-size:14px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--ink);color:var(--bg);font-variant-numeric:tabular-nums}
.pill.soft{background:transparent;color:var(--muted);border:1px solid var(--line)}
.strip{margin-top:6px;display:flex;align-items:center;gap:1px;overflow:hidden;white-space:nowrap;font-family:var(--serif);font-size:21px;line-height:1.5}
.tk{padding:0 2px;border-radius:6px}
.tk.past{opacity:.4}
.tk.cur{background:var(--accent);color:var(--accent-ink)}
.tk.lat{font-family:var(--sans);font-size:15px;font-weight:600;padding:1px 6px;margin:0 2px}
.tk.dots{color:var(--muted);font-family:var(--sans)}
.vi{margin-top:4px;font-size:13.5px;line-height:1.4;color:var(--muted);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;cursor:pointer}
.vi.open{-webkit-line-clamp:unset;display:block}
.brk{margin-top:6px;font-size:13px;font-weight:700;color:var(--accent)}
.warn{margin-top:6px;font-size:13px;line-height:1.35;color:var(--accent);font-weight:600}

nav{display:flex;gap:8px;flex:none}
nav button{height:58px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:17px}
#prev{flex:1}
#next{flex:2.6;background:var(--ink);color:var(--bg);border-color:var(--ink);font-size:19px}
nav button:disabled{opacity:.4}

#sheet{position:fixed;inset:0;background:var(--bg);z-index:5;overflow:auto;-webkit-overflow-scrolling:touch}
#sheet[hidden]{display:none}
.sheet-in{max-width:560px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.sheet-top{display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);padding:6px 0 10px;z-index:1}
.sheet-top h1{flex:1;margin:0;font-size:18px}
.close{height:40px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-weight:600}
.sheet h2{margin:18px 0 4px;font-size:16px}
.sub{font-size:13px;color:var(--muted);margin:0 0 8px}
.cl{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px 12px;margin:0 0 8px}
.cl .z{font-family:var(--serif);font-size:18px;line-height:1.45}
.cl .v{font-size:13px;color:var(--muted);margin-top:2px}
.cl[aria-current="true"]{border:2px solid var(--accent)}
.cl.fin{opacity:.55}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0}
.act{height:42px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-weight:600;font-size:14px}
.act.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.msg{background:var(--panel);border:1px solid var(--ok);border-radius:14px;padding:12px 14px;margin:6px 0 10px;font-weight:600}
.foot{margin-top:22px;font-size:13px;line-height:1.5;color:var(--muted)}
.foot a{color:var(--accent);font-weight:600}
@media (max-height:640px){ .py{font-size:22px} #info{padding:8px 12px} nav button{height:50px} .strip{font-size:19px} }
@media (prefers-reduced-motion:reduce){ #prog i{transition:none} }
</style>
</head>

<div id="app">
  <header>
    <button class="btn-list" id="btnList" type="button" aria-label="Mở danh sách câu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>

    </button>
    <div id="grp"></div>
    <div id="cnt"></div>
  </header>
  <div id="prog"><i></i></div>

  <div class="board-wrap" id="stage"><svg id="board" viewBox="0 0 1024 1024" role="img" aria-label="Chữ mẫu"></svg></div>

    <button type="button" class="ic" id="sNext" aria-label="Nét tiếp">&#8250;</button>

    <div class="speed" id="speed" role="group" aria-label="Tốc độ nét">
      <span>Tốc độ</span>
      <button type="button" data-s="0" aria-pressed="false">Rất chậm</button>

      <button type="button" data-s="3" aria-pressed="false">Nhanh</button>
    </div>
  </div>

  <section id="info" aria-live="polite"></section>

  <nav>
    <button type="button" id="prev" aria-label="Chữ trước">&#8249;</button>
    <button type="button" id="next">Tiếp &#8250;</button>
  </nav>
</div>

<div id="sheet" hidden>
  <div class="sheet-in">
    <div class="sheet-top"><h1 id="sheetTitle">Danh sách câu</h1><button type="button" class="close" id="closeSheet">Đóng</button></div>
    <div id="sheetBody"></div>
    <p class="foot">Hoạt hình nét lấy từ dữ liệu mở Make Me a Hanzi. Một vài chữ có thứ tự hoặc số nét khác chuẩn Đài Loan. Khi nghi ngờ, bạn đối chiếu trên
      <a href="https://stroke-order.learningweb.moe.edu.tw/" target="_blank" rel="noopener">trang筆順 của Bộ Giáo dục Đài Loan</a>.</p>
  </div>
</div>

const SPEEDS = [{ d: 2600, p: 900 }, { d: 1600, p: 600 }, { d: 1000, p: 400 }, { d: 600, p: 200 }];
let cardIdx = 0, pos = [0, 0], mode = "char", showNums = false, t = 0, raf = 0, pauseTimer = 0, sp = 1;
let meds = [], lens = [], numEls = [];

try {
  const s = JSON.parse(localStorage.getItem("hz2") || "null");
  if (s && typeof s.c === "number" && Array.isArray(s.p)) {
    cardIdx = clamp(s.c | 0, 0, CARDS.length - 1);
    pos = CARDS.map((c, i) => clamp((s.p[i] | 0), 0, c.tokens.length - 1));
    if (typeof s.s === "number") sp = clamp(s.s | 0, 0, SPEEDS.length - 1);
  }
} catch (e) {}
function save() { try { localStorage.setItem("hz2", JSON.stringify({ c: cardIdx, p: pos, s: sp })); } catch (e) {} }

const card = () => CARDS[cardIdx];
const tok = () => card().tokens[pos[cardIdx]];
const hasStrokes = tk => tk.t === "h" && DATA[tk.c];
const strokeN = tk => DATA[tk.c].s.length;
const strokeShown = tk => DATA[tk.c].n || strokeN(tk);

function buildBoard() {
  const tk = tok(), board = $("#board");
  let h = '<g class="grid" fill="none" stroke-width="4">' +
    '<rect x="8" y="8" width="1008" height="1008" stroke-width="8"/>' +
    '<path d="M512 8V1016M8 512H1016M8 8L1016 1016M1016 8L8 1016" stroke-dasharray="16 14"/></g>';
  meds = []; lens = []; numEls = [];
  if (hasStrokes(tk)) {
    const d = DATA[tk.c];
    h += '<g transform="translate(62 62) scale(.88)"><g transform="scale(1,-1) translate(0,-900)">';
    if (mode === "char") {
      h += '<g class="ink">' + d.s.map(p => '<path d="' + p + '"/>').join("") + '</g>';
    } else {
      h += '<g class="ghost">' + d.s.map(p => '<path d="' + p + '"/>').join("") + '</g>';
      h += '<defs>' + d.s.map((p, i) => '<clipPath id="c' + i + '"><path d="' + p + '"/></clipPath>').join("") + '</defs>';
      h += d.m.map((m, i) => '<g clip-path="url(#c' + i + ')"><path class="med" d="M' + m.map(q => q[0] + " " + q[1]).join(" L") + '"/></g>').join("");
    }
    h += '</g>';
    h += d.m.map((m, i) => '<g class="num" transform="translate(' + m[0][0] + " " + (900 - m[0][1]) + ')"><circle r="40"/><text y="15">' + (i + 1) + '</text></g>').join("");
    h += '</g>';
  } else if (tk.t === "h") {
    h += '<text class="big" x="512" y="530" font-size="760" font-family="Noto Serif TC, serif" lang="zh-Hant">' + tk.c + '</text>';
  } else if (tk.t === "p") {
    h += '<text class="big" x="512" y="540" font-size="640" font-family="Noto Serif TC, serif" lang="zh-Hant">' + tk.c + '</text>';
  } else {
    const fs = Math.min(420, Math.floor(900 / (tk.c.length * 0.62)));
    h += '<text class="big" x="512" y="540" font-size="' + fs + '" font-weight="600" font-family="Be Vietnam Pro, system-ui, sans-serif">' + tk.c + '</text>';
  }
  board.innerHTML = h;
  if (hasStrokes(tk)) {
    meds = [...board.querySelectorAll(".med")];
    lens = meds.map(m => { try { return m.getTotalLength() + 2; } catch (e) { return 1000; } });
    meds.forEach((m, i) => { m.style.strokeDasharray = lens[i] + " " + (lens[i] + 50); });
    numEls = [...board.querySelectorAll(".num")];
  }
  board.setAttribute("aria-label", tk.t === "h" ? "Chữ " + tk.c : tk.c);
}

function render() {
  const tk = tok();
  if (!hasStrokes(tk)) return;
  const N = strokeN(tk);
  if (mode === "strokes") {
    meds.forEach((m, i) => {
      const f = ease(clamp(t - i, 0, 1));
      if (f <= 0.001) m.setAttribute("visibility", "hidden");
      else {
        m.removeAttribute("visibility");
        m.style.strokeDashoffset = String(lens[i] * (1 - f));
        m.classList.toggle("cur", f < 0.999);
      }
    });
    numEls.forEach((n, i) => { n.style.display = (showNums && t > i + 0.02) ? "" : "none"; });
    $("#stk").textContent = "Nét " + Math.max(0, Math.ceil(t - 1e-6)) + "/" + N;
    const sc = $("#scrub");
    if (document.activeElement !== sc) sc.value = String(t);
  } else {
    numEls.forEach(n => { n.style.display = showNums ? "" : "none"; });
  }
}

function stopAnim() {
  if (raf) cancelAnimationFrame(raf); raf = 0;
  if (pauseTimer) clearTimeout(pauseTimer); pauseTimer = 0;
}
/* move t to target at the chosen speed; cb runs when it arrives */
function animateTo(target, cb) {
  stopAnim();
  const speed = 1 / SPEEDS[sp].d;
  if (reduce) { t = target; render(); if (cb) cb(); return; }
  let last = performance.now();
  const step = now => {
    const dt = Math.min(50, now - last); last = now;
    const dir = Math.sign(target - t);
    if (dir === 0) { raf = 0; render(); if (cb) cb(); return; }
    t += dir * dt * speed;
    if ((dir > 0 && t >= target) || (dir < 0 && t <= target)) { t = target; raf = 0; render(); if (cb) cb(); return; }
    render();
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}
/* draw one stroke at a time, with a pause between strokes so there is time to write */
function playFromStart() {
  const tk = tok(); if (!hasStrokes(tk)) return;
  const N = strokeN(tk);
  t = 0; render();
  const seq = i => animateTo(i + 1, () => { if (i + 1 < N) pauseTimer = setTimeout(() => seq(i + 1), SPEEDS[sp].p); });
  seq(0);
}

const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

function renderInfo() {
  const c = card(), tk = tok(), cl = c.clauses[tk.ci];
  let r1;
  if (tk.t === "h") {
    r1 = '<span class="py">' + esc(tk.py) + '</span>' +
      (DATA[tk.c] ? '<span class="pill">' + strokeShown(tk) + ' nét</span>' : '<span class="pill soft">chưa có hoạt hình</span>');
  } else if (tk.t === "p") {
    r1 = '<span class="lab">' + esc(tk.name) + '</span>';
  } else {
    r1 = '<span class="lab">Chữ Latin: viết bình thường</span>';
  }
  /* context strip: a window of the current clause */
  const toks = cl.tokens, W = 15;
  let a = Math.max(0, tk.k - 5), b = Math.min(toks.length, a + W);
  a = Math.max(0, b - W);
  let strip = a > 0 ? '<span class="tk dots">…</span>' : "";
  for (let i = a; i < b; i++) {
    const x = toks[i];
    const cls = "tk" + (x.t === "l" ? " lat" : "") + (i < tk.k ? " past" : "") + (i === tk.k ? " cur" : "");
    strip += '<span class="' + cls + '">' + esc(x.c) + '</span>';
  }
  if (b < toks.length) strip += '<span class="tk dots">…</span>';
  let html = '<div class="r1">' + r1 + '</div><div class="strip" lang="zh-Hant">' + strip + '</div>' +
    '<div class="vi" id="vi">' + esc(cl.vi) + '</div>';
  if (tk.brEnd) html += '<div class="brk">↵ Hết đoạn: xuống dòng mới</div>';
  if (tk.t === "h" && DATA[tk.c] && DATA[tk.c].n && DATA[tk.c].n !== strokeN(tk)) {
    html += '<div class="warn">Hoạt hình có ' + strokeN(tk) + ' nét, chuẩn Đài Loan tính ' + DATA[tk.c].n + ' nét. Khi chép hãy đối chiếu trang筆順 của Bộ Giáo dục.</div>';
  }
  $("#info").innerHTML = html;
  $("#vi").addEventListener("click", e => e.currentTarget.classList.toggle("open"));
}

function renderChrome() {
  const c = card(), tk = tok(), p = pos[cardIdx], n = c.tokens.length;
  $("#grp").textContent = c.title + " · câu " + (tk.ci + 1) + "/" + c.clauses.length;
  $("#cnt").textContent = (p + 1) + "/" + n;
  $("#prog i").style.width = ((p + 1) / n * 100) + "%";
  $("#prev").disabled = p === 0;
  $("#next").innerHTML = p === n - 1 ? "Xong thiệp ✓" : "Tiếp &#8250;";
  const han = hasStrokes(tk);
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.mode === mode)));
  $("#seg").classList.toggle("off", !han);
  $("#nums").classList.toggle("off", !han);
  $("#nums").setAttribute("aria-pressed", String(showNums));
  $("#anim").hidden = mode !== "strokes";
  $("#anim").classList.toggle("off", !han);
  if (han) $("#scrub").max = String(strokeN(tk));
}

function show(i) {
  stopAnim();
  pos[cardIdx] = clamp(i, 0, card().tokens.length - 1);
  t = 0;
  buildBoard();
  renderChrome();
  renderInfo();
  render();
  if (mode === "strokes") playFromStart();
  save();
}
function go(d) {
  const n = pos[cardIdx] + d;
  if (n < 0) return;
  if (n >= card().tokens.length) { openFinish(); return; }
  show(n);
}
function setMode(m) {
  if (m === mode) return;
  mode = m; stopAnim(); buildBoard(); renderChrome(); t = 0; render();
  if (mode === "strokes") playFromStart();
}

document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
$("#nums").addEventListener("click", () => { showNums = !showNums; renderChrome(); render(); });
$("#play").addEventListener("click", playFromStart);
$("#sPrev").addEventListener("click", () => { animateTo(Math.max(0, Math.ceil(t - 1e-6) - 1)); });
$("#sNext").addEventListener("click", () => { const tk = tok(); if (hasStrokes(tk)) animateTo(Math.min(strokeN(tk), Math.floor(t + 1e-6) + 1)); });
document.querySelectorAll("#speed button").forEach(b => b.addEventListener("click", () => {
  sp = parseInt(b.dataset.s, 10); save(); renderSpeed(); playFromStart();
}));
function renderSpeed() { document.querySelectorAll("#speed button").forEach(b => b.setAttribute("aria-pressed", String(parseInt(b.dataset.s, 10) === sp))); }
$("#scrub").addEventListener("input", e => { stopAnim(); t = parseFloat(e.target.value); render(); });
$("#prev").addEventListener("click", () => go(-1));
$("#next").addEventListener("click", () => go(1));

(function () {
  const el = $("#stage");
  let sx = 0, sy = 0, tracking = false;
  el.addEventListener("touchstart", e => { if (e.touches.length !== 1) return; tracking = true; sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  el.addEventListener("touchend", e => {
    if (!tracking) return; tracking = false;
    const c = e.changedTouches[0], dx = c.clientX - sx, dy = c.clientY - sy;
    if (Math.abs(dx) > 55 && Math.abs(dy) < 45) go(dx < 0 ? 1 : -1);
  }, { passive: true });
})();
document.addEventListener("keydown", e => {
  if (!$("#sheet").hidden) { if (e.key === "Escape") closeSheet(); return; }
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
});

/* sheet: pick card and jump to a clause */
function openSheet(msg) {
  let h = "";
  if (msg) h += '<div class="msg">' + msg + '</div>';
  CARDS.forEach((c, ci) => {
    const p = pos[ci], curCl = c.tokens[p].ci;
    h += '<h2>' + esc(c.full) + '</h2><p class="sub">Đang ở chữ ' + (p + 1) + '/' + c.tokens.length + '</p>';
    c.clauses.forEach((cl, i) => {
      const isCur = ci === cardIdx && i === curCl;
      const fin = i < curCl;
      h += '<button type="button" class="cl' + (fin ? " fin" : "") + '" data-c="' + ci + '" data-i="' + i + '"' + (isCur ? ' aria-current="true"' : "") + '>' +
        '<div class="z" lang="zh-Hant">' + esc(cl.zh) + '</div><div class="v">' + esc(cl.vi) + '</div></button>';
    });
    h += '<div class="row"><button type="button" class="act" data-restart="' + ci + '">Chép lại từ đầu</button></div>';
  });
  $("#sheetBody").innerHTML = h;
  $("#sheetTitle").textContent = "Danh sách câu";
  $("#sheet").hidden = false;
  $("#sheet").scrollTop = 0;
  $("#sheetBody").querySelectorAll(".cl").forEach(b => b.addEventListener("click", () => {
    cardIdx = parseInt(b.dataset.c, 10);
    closeSheet();
    show(CARDS[cardIdx].clStart[parseInt(b.dataset.i, 10)]);
  }));
  $("#sheetBody").querySelectorAll("[data-restart]").forEach(b => b.addEventListener("click", () => {
    cardIdx = parseInt(b.dataset.restart, 10);
    closeSheet(); show(0);
  }));
  $("#closeSheet").focus();
}
function openFinish() {
  const other = CARDS.findIndex((c, i) => i !== cardIdx);
  openSheet('Đã chép xong ' + esc(card().full) + '. Hãy đọc lại một lượt, kiểm tra dấu câu và chữ ký. Muốn sang ' + esc(CARDS[other].full) + ', bạn chọn câu đầu tiên ở bên dưới.');
}
function closeSheet() { $("#sheet").hidden = true; }
$("#btnList").addEventListener("click", () => openSheet());
$("#closeSheet").addEventListener("click", closeSheet);

renderSpeed();
show(pos[cardIdx]);
</script>
</body>
</html>
